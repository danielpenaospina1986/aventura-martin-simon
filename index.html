<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- En un telefono: que no se pueda hacer zoom con los dedos ni deslizar la
         pagina, que aqui los dedos son el mando; y que el lienzo llegue hasta
         debajo de la muesca. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Las aventuras de Samaon y Martain</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #10131c;
        overflow: hidden;
        /* El dedo maneja el juego, no la pagina: nada de deslizar, de rebote al
           llegar al borde, de seleccionar texto ni del menu que sale al dejar
           el dedo quieto. */
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #juego canvas {
        display: block;
      }

      /* De pie, en un telefono, el juego queda en una franja diminuta en mitad
         de la pantalla. Este cartel solo sale ahi: en un ordenador con la
         ventana alta el puntero es fino y la consulta no se cumple. */
      #gira {
        display: none;
      }
      @media (orientation: portrait) and (pointer: coarse) {
        #gira {
          display: flex;
          position: fixed;
          inset: 0;
          z-index: 10;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 18px;
          background: #10131c;
          color: #d8b24a;
          font-family: system-ui, -apple-system, sans-serif;
          text-align: center;
          padding: 24px;
        }
        #gira .telefono {
          width: 74px;
          height: 120px;
          border: 5px solid #d8b24a;
          border-radius: 14px;
          animation: girar 2.2s ease-in-out infinite;
        }
        #gira p {
          margin: 0;
          font-size: 20px;
          font-weight: 700;
        }
        #gira small {
          color: #f7f1e1;
          font-size: 14px;
          font-weight: 400;
        }
      }
      @keyframes girar {
        0%, 40% { transform: rotate(0deg); }
        60%, 100% { transform: rotate(90deg); }
      }
    </style>
  </head>
  <body>
    <div id="juego"></div>
    <div id="gira">
      <div class="telefono"></div>
      <p>Gira el teléfono</p>
      <small>El juego se ve mucho mejor acostado</small>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
